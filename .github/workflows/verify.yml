name: Batch Executor — offline tests and live Pharos batching
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-tests-and-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify 3 actions, result decoding, partial failure and reduction calculations
        run: npm test
      - name: Build Cloudflare Worker
        run: npm run build-check
  deployed-live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently execute actual Pharos read-only batches, with injected partial failure
        run: node scripts/smoke-deployed.mjs
      - name: Save timestamped JSON proof from real Pharos
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pharos-batch-executor-live-evidence
          path: proof/ci-live-batch.json
          retention-days: 30
          if-no-files-found: error
